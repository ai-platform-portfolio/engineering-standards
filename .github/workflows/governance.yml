name: Portfolio governance
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    uses: ai-platform-portfolio/ops-shared/.github/workflows/governance.yml@4cdff75db4e0fa6da200e39d370af4f7f825d3b7
  governance:
    if: always()
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.audit.result }}
        run: test "$RESULT" = success
