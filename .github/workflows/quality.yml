name: Standards quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./
      - uses: ./actions/workflow-lint
      - name: Prove malformed shell is rejected
        run: PATH="$RUNNER_TEMP:$PATH" bash tests/test_workflow_lint.sh
      - run: make check
